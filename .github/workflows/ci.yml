name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x']

    services:
      postgres:
        image: postgres:15-alpine@sha256:eff80106af603fce87e7e4a34b5dced1c91f7b02cafa9df2ac2f95c4aa327ad1
        env:
          POSTGRES_USER: nous
          # Test-only password for ephemeral CI service container
          POSTGRES_PASSWORD: ci_testonly_1234
          POSTGRES_DB: nous_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ea9a18ffd1bbdc26d8fde75e6f5c49c8ad53 # v5.1.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@6849a6489940f00c726f60b4e62185e5f045b69d # v4.1.2
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -race -count=1
        env:
          NOUS_TEST_POSTGRES_DSN: postgres://nous:ci_testonly_1234@localhost:5432/nous_test?sslmode=disable

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out -count=1
        env:
          NOUS_TEST_POSTGRES_DSN: postgres://nous:ci_testonly_1234@localhost:5432/nous_test?sslmode=disable

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16a3330d97d3eda44e4529bcfaaa4db78f # v4.4.0
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ea9a18ffd1bbdc26d8fde75e6f5c49c8ad53 # v5.1.0
        with:
          go-version: '1.26.x'

      - name: Build binary
        run: go build -o nous ./cmd/nous

      - name: Build Docker image
        run: docker build -t nous:latest .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ea9a18ffd1bbdc26d8fde75e6f5c49c8ad53 # v5.1.0
        with:
          go-version: '1.26.x'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9710a31108bf923969916e27be2a38345e0a8825 # v6.1.0
        with:
          version: latest
          args: --timeout=5m
