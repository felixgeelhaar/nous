name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nous
          POSTGRES_PASSWORD: ci_testonly_1234
          POSTGRES_DB: nous_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: go test ./... -race -count=1 -coverprofile=coverage.out
        env:
          NOUS_TEST_POSTGRES_DSN: postgres://nous:ci_testonly_1234@localhost:5432/nous_test?sslmode=disable

      - name: Install coverctl
        run: go install github.com/felixgeelhaar/coverctl@latest

      - name: Enforce coverage policy
        run: coverctl check --from-profile coverage.out -o json
        # `coverctl check` exits 1 on any domain falling below its
        # threshold in .coverctl.yaml.

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install nox
        run: go install github.com/felixgeelhaar/nox/cmd/nox@latest

      - name: Scan against baseline
        run: nox scan .

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build binary
        run: go build -o nous ./cmd/nous

      - name: Build Docker image
        run: docker build -t nous:latest .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          args: --timeout=5m
