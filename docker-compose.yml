version: "3.8"

services:
  nous:
    build: .
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      NOUS_DB_TYPE: sqlite
      NOUS_DB_DSN: /data/nous.db
      NOUS_GRPC_ADDR: :50051
      NOUS_HTTP_ADDR: :8080
      NOUS_TICK_INTERVAL: 5m
    volumes:
      - nous-data:/data
    restart: unless-stopped

volumes:
  nous-data:
