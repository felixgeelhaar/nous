version: "2"
run:
  timeout: 5m
  skip-dirs:
    - internal/adapters # has generated mocks
  skip-files:
    - ".*_test.go$"          # skip errcheck in tests
    - ".*_mock.go$"          # skip generated mocks

linters:
  enable:
    - gocritic
    - govet
    - staticcheck
    - unused
    # errcheck disabled globally - too many false positives with Close() in cleanup
  disable:
    - errcheck

  settings:
    govet:
      check-shadowing: false
