version: "2"

run:
  timeout: 5m

linters:
  enable:
    - gocritic
    - govet
    - staticcheck
    - unused

  disable:
    - errcheck   # too many false positives with Close() in cleanup paths

  exclusions:
    paths:
      - internal/adapters   # generated mocks
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]
      - path: _mock\.go
        linters: [errcheck, gosec, gocritic]
