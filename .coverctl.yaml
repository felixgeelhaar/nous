version: 1
language: go
policy:
  default:
    min: 80
  domains:
    # cmd/nous is mostly run() server-bootstrap wiring. Helper
    # functions (buildJWTVerifier, buildJWTRotator, buildValidator,
    # buildCommitmentExtractor) are unit-tested; floor reflects that.
    - name: cmd
      match:
        - ./cmd/...
      min: 20
    - name: config
      match:
        - ./internal/config/...
      min: 80
    - name: coordination
      match:
        - ./internal/coordination/...
      min: 80
    - name: domain
      match:
        - ./internal/domain/...
      min: 90
    - name: intervention
      match:
        - ./internal/intervention/...
      min: 83.7
    # Anthropic / OpenAI / Gemini / Bedrock providers ship with
    # httptest unit tests covering the happy path + error branches;
    # Bedrock live path is gated on AWS creds (only verified locally).
    - name: llm
      match:
        - ./internal/llm/...
      min: 82
    - name: observability
      match:
        - ./internal/observability/...
      min: 80
    - name: pipeline
      match:
        - ./internal/pipeline/...
      min: 80
    # ports holds interface declarations only; no executable code to cover.
    - name: ports
      match:
        - ./internal/ports/...
      min: 0
    - name: risk
      match:
        - ./internal/risk/...
      min: 89.3
    # Postgres backend is tested in CI via NOUS_TEST_POSTGRES_DSN; the
    # local profile reports 0% so the aggregate dips. Ratchet upward
    # once integration coverage merges.
    - name: store
      match:
        - ./internal/store/...
      min: 45
    - name: transport
      match:
        - ./internal/transport/...
      min: 75
    - name: worker
      match:
        - ./internal/worker/...
      min: 82.6
